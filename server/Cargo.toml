[package]
name = "server"
version = "1.0.0"
edition = "2024"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
uuid = { version = "1.19.0", features = ["v4"] }
dashmap = "6.1.0"
bytes = "1.11.0"
